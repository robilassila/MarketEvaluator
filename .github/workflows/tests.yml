name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: market_evaluator/pom.xml

      - name: Run unit tests
        working-directory: market_evaluator
        run: mvn --batch-mode --no-transfer-progress test
