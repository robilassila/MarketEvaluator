services:
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL serves the other containers; HOST serves tools on the host through the published port.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by the tools with explicit partition counts and retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Runs the producer, job or subscriber: docker compose run --rm evaluator <program> [options].
  # Paths are relative to the repository root; only data/ (read-only) and results/ are mounted.
  evaluator:
    build: market_evaluator
    image: market-evaluator
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/workspace/data:ro
      - ./results:/workspace/results

  # Runs Maven: docker compose run --rm test [goals], default verify.
  test:
    image: maven:3.9-eclipse-temurin-17
    profiles: [tools]
    working_dir: /workspace/market_evaluator
    entrypoint: [mvn, --batch-mode, --no-transfer-progress]
    command: [verify]
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      # Testcontainers starts its Kafka container as a sibling on the host's Docker daemon
      # and reaches its published port through the host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  maven-cache:
